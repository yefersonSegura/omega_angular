<div class="wrap">
  <h1>Pedidos</h1>
  @if (loading()) {
    <p class="muted">Loading…</p>
  }
  @if (error()) {
    <p class="error" role="alert">{{ error() }}</p>
  }
  @if (!loading() && !error()) {
    <ul>
      @for (c of items(); track c.id) {
        <li>{{ c.nombre }} <span class="meta">({{ c.id }})</span></li>
      }
    </ul>
  }
</div>
